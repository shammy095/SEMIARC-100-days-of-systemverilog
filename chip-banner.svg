<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SEMI ARC 100 Days of SystemVerilog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#0A192F"/>
      <stop offset="1" stop-color="#062B3A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    .trace{fill:none;stroke:#1E90FF;stroke-opacity:.35;stroke-width:2}
    .flow{fill:none;stroke:#00E5FF;stroke-width:3;stroke-linecap:round;stroke-dasharray:12 188;animation:flow 3.5s linear infinite}
    .flow.b{animation-duration:4.5s;animation-delay:-1.2s}
    .flow.c{animation-duration:5.5s;animation-delay:-2.4s}
    @keyframes flow{to{stroke-dashoffset:-200}}
    .node{fill:#00E5FF;animation:pulse 2.4s ease-in-out infinite}
    .node.b{animation-delay:-.8s}
    .node.c{animation-delay:-1.6s}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    .die{fill:#000000;fill-opacity:.55;stroke:#00E5FF;stroke-opacity:.6;stroke-width:2}
    .pins{fill:none;stroke:#1E90FF;stroke-width:3;stroke-opacity:.7}
    .title{font-family:Consolas,'Courier New',monospace;font-weight:700;font-size:84px;letter-spacing:12px;fill:#00E5FF}
    .sub{font-family:Consolas,'Courier New',monospace;font-size:24px;letter-spacing:8px;fill:#FFFFFF}
    .tag{font-family:Consolas,'Courier New',monospace;font-size:18px;letter-spacing:6px;fill:#1E90FF}
    .glow{animation:pulse 4s ease-in-out infinite}
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- left traces -->
  <path class="trace" d="M0 90H150L190 130H400"/>
  <path class="trace" d="M0 160H110L150 200H400"/>
  <path class="trace" d="M0 250H200L230 220H400"/>
  <path class="flow" pathLength="200" d="M0 90H150L190 130H400"/>
  <path class="flow b" pathLength="200" d="M0 160H110L150 200H400"/>
  <path class="flow c" pathLength="200" d="M0 250H200L230 220H400"/>
  <circle class="node" cx="190" cy="130" r="5"/>
  <circle class="node b" cx="150" cy="200" r="5"/>
  <circle class="node c" cx="230" cy="220" r="5"/>

  <!-- right traces -->
  <path class="trace" d="M1200 90H1050L1010 130H800"/>
  <path class="trace" d="M1200 160H1090L1050 200H800"/>
  <path class="trace" d="M1200 250H1000L970 220H800"/>
  <path class="flow c" pathLength="200" d="M1200 90H1050L1010 130H800"/>
  <path class="flow" pathLength="200" d="M1200 160H1090L1050 200H800"/>
  <path class="flow b" pathLength="200" d="M1200 250H1000L970 220H800"/>
  <circle class="node c" cx="1010" cy="130" r="5"/>
  <circle class="node" cx="1050" cy="200" r="5"/>
  <circle class="node b" cx="970" cy="220" r="5"/>

  <!-- chip package -->
  <path class="pins" d="M440 70V50M500 70V50M560 70V50M620 70V50M680 70V50M740 70V50M440 270V290M500 270V290M560 270V290M620 270V290M680 270V290M740 270V290"/>
  <rect class="die" x="400" y="70" width="400" height="200" rx="10"/>
  <circle class="glow" cx="422" cy="92" r="5" fill="#00E5FF"/>

  <text class="title" x="600" y="160" text-anchor="middle">SEMI ARC</text>
  <text class="sub" x="600" y="204" text-anchor="middle">100 DAYS OF SYSTEMVERILOG</text>
  <text class="tag" x="600" y="244" text-anchor="middle">DESIGN • VERIFICATION • UVM</text>
</svg>
